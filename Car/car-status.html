<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สถานะรถยนต์ - Corporate Car</title>
    <link rel="stylesheet" href="navbar.css" />
    <link rel="stylesheet" href="car-status.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="booking-page">
    <nav class="nav-bar">
      <div class="logo">
        <img src="assets/image/CH2.png" alt="nav-logo" />
      </div>
      <div class="menu-toggle" id="mobile-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <ul class="nav-links" id="nav-list">
        <li><a href="homepage.html" class="Home-btn">หน้าหลัก</a></li>
        <li><a href="booking.html" class="book-btn">จองรอบขับ</a></li>
        <li><a href="car-status.html" class="Check-btn">เช็กคิว</a></li>
        <li>
          <a href="car-details.html" class="info-btn">รายละเอียดรถยนต์</a>
        </li>
        <li>
          <a href="booking-details.html" class="Rules-btn">รายละเอียดการจอง</a>
        </li>
        <li><a href="profile.html" class="contact-btn">ข้อมูลผู้ใช้</a></li>
      </ul>
    </nav>

    <div class="status-container">
      <section class="car-section">
        <h2 class="section-title">เลือกรถที่ต้องการเช็ค</h2>
        <div class="scroll-container">
          <div id="car-grid" class="car-grid-horizontal"></div>
        </div>
      </section>

      <section class="date-picker-section">
        <div class="date-picker-header">
          <h2 class="section-title" style="margin-bottom: 0">เลือกวันที่</h2>
          <select id="month-select" class="month-dropdown"></select>
        </div>
        <div id="day-strip" class="day-strip"></div>
      </section>

      <section class="booking-status-section">
        <div id="booking-status-panel" class="booking-status-panel">
          <p style="color: #94a3b8; text-align: center">
            👆 กรุณาเลือกรถด้านบนก่อน
          </p>
        </div>
      </section>
    </div>

    <script src="main.js"></script>
    <script src="car-status.js"></script>
  </body>
</html>
