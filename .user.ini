; PHP settings for this site (php-cgi reads .user.ini from the script folder up to the site root).
; Fixes sessions that are not created by login_process.php (e.g. remember-me auto login) having no HttpOnly/SameSite.
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
session.use_only_cookies = 1
; Never show PHP errors (with full server paths) to visitors; they still go to the error log.
display_errors = Off
; Write error_log() to a file outside the web root. Without this php-cgi writes to stderr and IIS turns
; every logged message into an HTTP 500 page that shows the message (SQL errors etc.) to the user.
log_errors = On
date.timezone = "Asia/Bangkok"
error_log = "D:\CarBooking\logs\php_errors.log"
